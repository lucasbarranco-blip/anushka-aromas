<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Anushka Aromas</title>
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#3a3230;--muted:#8b7d72;--accent:#7c6a58;--accent2:#a68a64;--line:#e7ddd0;--sage:#8a9a7b;--wa:#25d366;}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 18px}
header.hero{background:linear-gradient(135deg,#efe7db,#e5d8c6);border-bottom:1px solid var(--line);padding:30px 0 24px;text-align:center}
.hero img.logo{max-width:300px;width:70%;height:auto;background:#fff;border-radius:16px;padding:14px 20px;box-shadow:0 4px 18px rgba(0,0,0,.10)}
.hero p.tag{color:var(--muted);margin:14px 0 0;font-size:15px}
.hero p.sub{color:var(--accent);margin:10px 0 0;font-size:13.5px;max-width:640px;margin-left:auto;margin-right:auto;line-height:1.5}
.toolbar{position:sticky;top:0;z-index:40;background:rgba(246,241,234,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0}
.toolbar .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#search{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:30px;background:#fff;font-size:14px;outline:none}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:7px 13px;border:1px solid var(--line);border-radius:30px;background:#fff;cursor:pointer;text-decoration:none;color:var(--accent);white-space:nowrap}
.chip:hover{background:var(--accent);color:#fff}
.count{font-size:12px;color:var(--muted);text-align:center;padding:14px 0 2px}
section.cat{padding:26px 0 6px}
section.cat h2{font-family:Georgia,serif;font-size:24px;margin:0 0 2px;color:var(--accent);border-bottom:2px solid var(--accent2);display:inline-block;padding-bottom:4px}
.sub-h{font-size:14px;font-weight:600;color:var(--sage);text-transform:uppercase;letter-spacing:1px;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.15s;position:relative}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-2px)}
.card .imgbox{aspect-ratio:1;background:#fff;overflow:hidden}
.card.nostock .imgbox{filter:grayscale(.7) opacity(.65)}
.cthumb{width:52px;height:52px;border-radius:8px;background:#fff;flex:none}
.card .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .name{font-size:14px;font-weight:600;line-height:1.3;min-height:36px}
.card .price{font-size:18px;font-weight:700;color:var(--accent)}
.card .price .old{font-size:13px;color:var(--muted);text-decoration:line-through;font-weight:500;margin-right:6px}
.card .badge{position:absolute;top:10px;left:10px;color:#fff;font-size:11px;padding:3px 9px;border-radius:20px}
.badge.sin{background:#b23b3b}
.badge.of{background:#2e7d46;left:auto;right:10px}
.card .add{margin-top:auto;border:none;background:var(--sage);color:#fff;font-size:13.5px;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.card .add:hover{background:#75856a}
.card .add.in{background:var(--accent)}
.card .add:disabled{background:#cfc7bd;cursor:default}
.wa-print{display:none}
.fab{position:fixed;bottom:20px;right:20px;z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.cartBtn{background:var(--accent);color:#fff;border:none;border-radius:30px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;gap:9px;align-items:center}
.cartBtn .badge2{background:#fff;color:var(--accent);border-radius:50%;min-width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px}
.pdfBtn{background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:30px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.drawer{position:fixed;top:0;right:0;height:100%;width:370px;max-width:92vw;background:#fff;z-index:80;box-shadow:-6px 0 30px rgba(0,0,0,.2);transform:translateX(105%);transition:.25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer h3{margin:0;font-family:Georgia,serif;font-size:20px}
.drawer .dh{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted)}
.drawer .items{flex:1;overflow:auto;padding:10px 18px}
.ci{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ci img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.ci .n{flex:1;font-size:13px;line-height:1.3}
.ci .n small{color:var(--accent);font-weight:700;display:block;font-size:13px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}
.dfoot{padding:16px 18px;border-top:1px solid var(--line)}
.dfoot .tot{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:12px}
.sendWa{display:block;width:100%;background:var(--wa);color:#fff;text-align:center;text-decoration:none;padding:14px;border-radius:11px;font-size:15px;font-weight:700;border:none;cursor:pointer}
.dfoot small{display:block;color:var(--muted);font-size:11px;margin-top:8px;text-align:center}
footer.foot{text-align:center;padding:34px 18px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:24px}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
@media print{
 .toolbar,.fab,.drawer,.add{display:none!important}
 body{background:#fff}
 .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
 .grid{grid-template-columns:repeat(3,1fr);gap:10px}
 section.cat{break-inside:avoid}
 .card:hover{transform:none}
 .card .wa-print{display:block!important;font-size:11px;color:#128c4b;text-decoration:none;margin-top:5px;font-weight:700;border:1px solid #128c4b;border-radius:6px;padding:4px;text-align:center}
}
</style>
</head>
<body>
<header class="hero">
  <img class="logo" src="logo.png" alt="Anushka Aromas">
  <p class="tag" id="tag"></p>
  <p class="sub">Elegí tus productos favoritos tocando "Agregar". Cuando termines, enviás el pedido completo por WhatsApp con un solo toque. 💬</p>
</header>
<div class="toolbar"><div class="wrap"><div class="row">
  <input id="search" type="search" placeholder="🔍 Buscar producto (ej: difusor, cuarzo, sándalo)...">
  <div class="chips" id="chips"></div>
</div></div></div>
<div class="count" id="count"></div>
<main class="wrap" id="main"><div class="loading">Cargando catálogo…</div></main>
<footer class="foot" id="foot"></footer>
<div class="fab">
  <button class="pdfBtn" id="pdfBtn">⬇ Guardar como PDF</button>
  <button class="cartBtn" id="cartBtn">🛒 Mi pedido <span class="badge2" id="badge" style="display:none">0</span></button>
</div>
<div class="drawer" id="drawer">
  <div class="dh"><h3>Mi pedido</h3><button class="close" id="closeD">×</button></div>
  <div class="items" id="items"></div>
  <div class="dfoot">
    <div class="tot"><span>Total aprox.</span><span id="tot">$0,00</span></div>
    <a class="sendWa" id="sendWa" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
    <small>El total es orientativo. Coordiná envío y pago por WhatsApp.</small>
  </div>
</div>
<script>
const cart=new Map(); let META={}, PRODUCTS=[];
function fmt(n){return '$'+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtInt(n){return '$'+Number(n).toLocaleString('es-AR');}

fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  META=d.meta; PRODUCTS=d.products.filter(p=>p.visible).map((p,idx)=>({...p,_i:idx}));
  document.getElementById('tag').textContent=META.tagline;
  document.getElementById('foot').innerHTML='Catálogo de '+META.store+' · Pedidos por WhatsApp +54 9 11 2464-1973';
  render();
}).catch(e=>{document.getElementById('main').innerHTML='<div class="loading">No se pudo cargar el catálogo. Recargá la página.</div>';});

function waLink(p){return 'https://wa.me/'+META.whatsapp+'?text='+encodeURIComponent('¡Hola Anushka! 🌿 Quiero pedir: '+p.n+' ('+fmtInt(p.of||p.p)+')');}
function sprite(ix){const M=META.sprite;const s=Math.floor(ix/M.per),li=ix%M.per,c=li%M.cols,r=Math.floor(li/M.cols);return "background-image:url('sprite_"+s+".jpg');background-size:"+(M.cols*100)+"% "+(M.rows*100)+"%;background-position:"+(c/(M.cols-1)*100).toFixed(4)+"% "+(r/(M.rows-1)*100).toFixed(4)+"%;background-repeat:no-repeat";}

function render(){
  const main=document.getElementById('main'); main.innerHTML='';
  document.getElementById('count').textContent=PRODUCTS.length+' productos disponibles';
  const byTop={}; PRODUCTS.forEach(p=>{(byTop[p.top]=byTop[p.top]||[]).push(p);});
  const order=META.topsOrder||Object.keys(byTop);
  const tops=order.filter(t=>byTop[t]).concat(Object.keys(byTop).filter(t=>!order.includes(t)));
  const chips=document.getElementById('chips'); chips.innerHTML='';
  tops.forEach(t=>{const a=document.createElement('a');a.className='chip';a.href='#cat-'+slug(t);a.textContent=t+' ('+byTop[t].length+')';chips.appendChild(a);});
  tops.forEach(t=>{
    const list=byTop[t];
    const sec=document.createElement('section');sec.className='cat';sec.id='cat-'+slug(t);
    const h2=document.createElement('h2');h2.textContent=t;sec.appendChild(h2);
    const bySub={};list.forEach(p=>{(bySub[p.sub||'']=bySub[p.sub||'']||[]).push(p);});
    const subKeys=Object.keys(bySub).sort();
    subKeys.forEach(sk=>{
      if(sk && (subKeys.length>1 || sk!==t)){const sh=document.createElement('div');sh.className='sub-h';sh.textContent=sk;sec.appendChild(sh);}
      const grid=document.createElement('div');grid.className='grid';
      bySub[sk].forEach(p=>grid.appendChild(card(p)));
      sec.appendChild(grid);
    });
    main.appendChild(sec);
  });
  renderCart();
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-');}
function card(p){
  const c=document.createElement('div');c.className='card'+(p.stock?'':' nostock');c.dataset.name=p.n.toLowerCase();
  const price=p.of? '<span class="old">'+fmtInt(p.p)+'</span>'+fmtInt(p.of) : fmtInt(p.p);
  c.innerHTML=
    '<div class="imgbox" style="'+sprite(p.ix)+'"></div>'+
    (p.stock?'':'<span class="badge sin">Sin stock</span>')+
    (p.of?'<span class="badge of">Oferta</span>':'')+
    '<div class="body"><div class="name">'+p.n+'</div>'+
    '<div class="price">'+price+'</div>'+
    (p.stock?'<button class="add" data-i="'+p._i+'">+ Agregar</button>':'<button class="add" disabled>Sin stock</button>')+
    '<a class="wa-print" href="'+waLink(p)+'">📲 Pedir por WhatsApp</a></div>';
  const btn=c.querySelector('.add');
  if(p.stock) btn.addEventListener('click',e=>toggle(p._i,e.target));
  return c;
}
function toggle(i,btn){if(cart.has(i))cart.delete(i);else cart.set(i,1);syncBtns();renderCart();openDrawer(true);}
function syncBtns(){document.querySelectorAll('.add[data-i]').forEach(b=>{const i=+b.dataset.i;if(cart.has(i)){b.classList.add('in');b.textContent='✓ Agregado';}else{b.classList.remove('in');b.textContent='+ Agregar';}});}
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(c=>{c.style.display=c.dataset.name.includes(q)?'':'none';});
  document.querySelectorAll('section.cat').forEach(sec=>{const any=[...sec.querySelectorAll('.card')].some(c=>c.style.display!=='none');sec.style.display=any?'':'none';});
});
const drawer=document.getElementById('drawer');
function openDrawer(v){drawer.classList.toggle('open',v);}
document.getElementById('cartBtn').addEventListener('click',()=>openDrawer(!drawer.classList.contains('open')));
document.getElementById('closeD').addEventListener('click',()=>openDrawer(false));
function renderCart(){
  const wrap=document.getElementById('items');wrap.innerHTML='';let total=0,n=0;
  if(cart.size===0)wrap.innerHTML='<div class="empty">Todavía no elegiste productos.<br>Tocá "+ Agregar" en los que te gusten. 🌿</div>';
  cart.forEach((q,i)=>{
    const p=PRODUCTS[i];const price=p.of||p.p;total+=price*q;n+=q;
    const row=document.createElement('div');row.className='ci';
    row.innerHTML='<div class="cthumb" style="'+sprite(p.ix)+'"></div><div class="n">'+p.n+'<small>'+fmtInt(price)+'</small></div>'+
      '<div class="qty"><button data-m="'+i+'">−</button><span>'+q+'</span><button data-p="'+i+'">+</button></div>';
    row.querySelector('[data-m]').onclick=()=>{const nq=q-1;if(nq<=0){cart.delete(i);syncBtns();}else cart.set(i,nq);renderCart();};
    row.querySelector('[data-p]').onclick=()=>{cart.set(i,q+1);renderCart();};
    wrap.appendChild(row);
  });
  document.getElementById('tot').textContent=fmt(total);
  const bd=document.getElementById('badge');bd.textContent=n;bd.style.display=n?'inline-flex':'none';
  let msg='¡Hola Anushka! 🌿 Quiero hacer este pedido:%0A%0A';
  cart.forEach((q,i)=>{const p=PRODUCTS[i];msg+=encodeURIComponent('• '+q+'x '+p.n+' — '+fmtInt(p.of||p.p))+'%0A';});
  msg+='%0A'+encodeURIComponent('Total aprox: '+fmt(total));
  document.getElementById('sendWa').href='https://wa.me/'+META.whatsapp+'?text='+msg;
}
document.getElementById('pdfBtn').addEventListener('click',()=>window.print());
</script>
</body>
</html>
